name: Import audited phase 4.5a

on:
  push:
    branches:
      - chore/import-phase-4.5a

permissions:
  contents: write

jobs:
  import-audited-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate and publish exact audited correction
        shell: bash
        run: |
          set -euo pipefail

          PARENT="48732b3b16088273a4031adb6bc2cff263adb2db"
          COMMIT="091d2a5f9d9dcc8ddb646fc1f303baec1b52fad6"
          TREE="eef63cace715df82a7ec6664efb70bff5a68b775"
          TARGET="refs/heads/feat/edit-call-failure-details"

          cp .phase-import/phase45a.patch.b64 /tmp/phase45a.patch.b64

          git cat-file -e "${PARENT}^{commit}"
          git checkout --detach "${PARENT}"

          base64 -d /tmp/phase45a.patch.b64 | gzip -d > /tmp/phase45a.patch
          git apply --index /tmp/phase45a.patch

          tree="$(git write-tree)"
          test "${tree}" = "${TREE}"

          export GIT_AUTHOR_NAME="Codex"
          export GIT_AUTHOR_EMAIL="codex@openai.com"
          export GIT_AUTHOR_DATE="@1790697970 -0300"
          export GIT_COMMITTER_NAME="Codex"
          export GIT_COMMITTER_EMAIL="codex@openai.com"
          export GIT_COMMITTER_DATE="@1790697970 -0300"

          recreated="$(printf '%s\n' 'test(integration): compare failure timestamps after finish' | git commit-tree "${TREE}" -p "${PARENT}")"
          test "${recreated}" = "${COMMIT}"

          remote_before="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          test "${remote_before}" = "${PARENT}"

          git push origin "${COMMIT}:${TARGET}"

          remote_after="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          test "${remote_after}" = "${COMMIT}"

          echo "Updated audited branch to ${remote_after}."
