name: Validar pull request

on:
  pull_request:
    branches:
      - main
      - feat/dashboard-i18n-pt-en-zh-tw-20261014

permissions:
  contents: read

jobs:
  validate-installer-windows:
    name: Instalador no Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar parser e regressões do instalador
        shell: powershell
        run: .\installer\tests\installer-runtime-regression.ps1

      - name: Validar transação reversível HTTP e HTTPS
        shell: powershell
        run: .\installer\tests\https-transport-transaction-regression.ps1

      - name: Validar scripts HTTPS de homologação
        shell: powershell
        run: .\homologation\https\Test-AndonHttpsHomologation.ps1

  validate:
    name: Build, PostgreSQL e fluxos críticos
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: andon
          POSTGRES_PASSWORD: andon_test_password
          POSTGRES_DB: andon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andon -d andon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://andon:andon_test_password@127.0.0.1:5432/andon_test?schema=public
      HOST: 127.0.0.1
      NODE_ENV: test

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix server

      - name: Aplicar migrations no PostgreSQL 16
        run: |
          npm run db:generate --prefix server
          npm run db:migrate --prefix server

      - name: Validar backend e credenciais
        run: |
          npm run build --prefix server
          npm run test:auth --prefix server
          npm run test:access --prefix server
          npm run test:analytics --prefix server
          npm run test:dashboard --prefix server
          npm run test:impact --prefix server
          npm run test:ui --prefix server
          npm run test:installer --prefix server
          npm run test:plc --prefix server

      - name: Validar API e fluxos críticos
        run: |
          npm run start --prefix server > /tmp/andon-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ANDON_INTEGRATION_TEST=1 npm run test:integration --prefix server || {
            cat /tmp/andon-api.log
            exit 1
          }

      - name: Validar fundação de acessos no PostgreSQL
        run: ANDON_INTEGRATION_TEST=1 npm run test:access:integration --prefix server

      - name: Validar usuários por HTTPS e PostgreSQL
        run: ANDON_INTEGRATION_TEST=1 node server/scripts/validate-access-http.mjs

      - name: Validar admissão segura de workstations
        run: ANDON_INTEGRATION_TEST=1 node server/scripts/validate-workstation-admission.mjs

      - name: Validar identidades de serviços industriais
        run: ANDON_INTEGRATION_TEST=1 npm run test:service:integration --prefix server

      - name: Validar runtime HTTPS de homologação
        run: ANDON_INTEGRATION_TEST=1 npm run test:https:integration --prefix server

      - name: Validar frontend e SSR
        run: |
          npm run typecheck
          npm run build

      - name: Validar runtime compilado HTTP e HTTPS
        run: |
          mkdir -p /tmp/andon-compiled-runtime
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/andon-compiled-runtime/key.pem \
            -out /tmp/andon-compiled-runtime/cert.pem \
            -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

          HOST=127.0.0.1 PORT=4188 \
          ANDON_TLS_CERT=/tmp/andon-compiled-runtime/cert.pem \
          ANDON_TLS_KEY=/tmp/andon-compiled-runtime/key.pem \
          ANDON_TLS_HOST=localhost \
          node scripts/serve-frontend.mjs > /tmp/andon-compiled-runtime/server.log 2>&1 &
          runtime_pid=$!
          trap 'kill "$runtime_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent --cacert /tmp/andon-compiled-runtime/cert.pem \
              https://localhost:4188/hub >/tmp/andon-compiled-runtime/hub.html && break
            sleep 1
          done
          test -s /tmp/andon-compiled-runtime/hub.html || {
            cat /tmp/andon-compiled-runtime/server.log
            exit 1
          }
          grep -q '<!DOCTYPE html>' /tmp/andon-compiled-runtime/hub.html
          ! grep -q 'res.setHeaders is not a function' /tmp/andon-compiled-runtime/server.log
          ! curl --fail --silent http://127.0.0.1:4188/hub >/dev/null 2>&1

      - name: Validar interface de admissão em desktop e mobile
        run: |
          mkdir -p /tmp/andon-playwright
          npm install --prefix /tmp/andon-playwright --no-save --package-lock=false playwright@1.56.1
          /tmp/andon-playwright/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/andon-admission-browser
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/andon-admission-browser/key.pem \
            -out /tmp/andon-admission-browser/cert.pem \
            -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          HOST=127.0.0.1 PORT=4187 node scripts/serve-frontend.mjs > /tmp/andon-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4187/hub >/dev/null && break
            sleep 1
          done
          ANDON_TEST_TLS_KEY=/tmp/andon-admission-browser/key.pem \
          ANDON_TEST_TLS_CERT=/tmp/andon-admission-browser/cert.pem \
          ANDON_PLAYWRIGHT_MODULE=/tmp/andon-playwright/node_modules/playwright/index.mjs \
          node tests/browser/workstationAdmission.mjs
          ANDON_TEST_TLS_KEY=/tmp/andon-admission-browser/key.pem \
          ANDON_TEST_TLS_CERT=/tmp/andon-admission-browser/cert.pem \
          ANDON_PLAYWRIGHT_MODULE=/tmp/andon-playwright/node_modules/playwright/index.mjs \
          node tests/browser/hubAdminNavigation.mjs
          ANDON_TEST_TLS_KEY=/tmp/andon-admission-browser/key.pem \
          ANDON_TEST_TLS_CERT=/tmp/andon-admission-browser/cert.pem \
          ANDON_PLAYWRIGHT_MODULE=/tmp/andon-playwright/node_modules/playwright/index.mjs \
          node tests/browser/hubUsers.mjs

      - name: Publicar capturas da admissão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workstation-admission-visual-evidence
          path: docs/validation/workstation-admission-20261027
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar capturas da administração do Hub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-admin-navigation-visual-evidence
          path: docs/validation/hub-admin-navigation-20261027
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar capturas de usuários e acessos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-users-https-visual-evidence
          path: docs/validation/hub-users-20261026
          if-no-files-found: warn
          retention-days: 30

      - name: Garantir build sem alterar route tree versionado
        run: |
          git diff --exit-code -- src/routeTree.gen.ts
          test -z "$(git status --porcelain -- src/routeTree.gen.ts)"
