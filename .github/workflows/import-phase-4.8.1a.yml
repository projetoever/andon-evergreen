name: Import audited phase 4.8.1A

on:
  push:
    branches:
      - chore/import-phase-4.8.1a

permissions:
  contents: write

jobs:
  import-audited-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate and publish exact audited phase 4.8.1A commit
        shell: bash
        run: |
          set -euo pipefail

          PARENT="6ee77e59b005ea023deefbb4e8bed2767238126c"
          COMMIT="f1becbf2c19ba4fd042519d0457e74772fb98aa4"
          TREE="1ae3ed8ac83c3a2e74f3305eb2ae25281c78227e"
          TARGET="refs/heads/fix/history-deduplicate-failure-description"

          cp .phase-import/phase481a.patch.b64 /tmp/phase481a.patch.b64

          git cat-file -e "${PARENT}^{commit}"
          git checkout --detach "${PARENT}"

          base64 -d /tmp/phase481a.patch.b64 | gzip -d > /tmp/phase481a.patch
          git apply --index /tmp/phase481a.patch

          tree="$(git write-tree)"
          test "${tree}" = "${TREE}"

          export GIT_AUTHOR_NAME="Codex"
          export GIT_AUTHOR_EMAIL="codex@openai.com"
          export GIT_AUTHOR_DATE="@1790769911 +1000"
          export GIT_COMMITTER_NAME="Codex"
          export GIT_COMMITTER_EMAIL="codex@openai.com"
          export GIT_COMMITTER_DATE="@1790769911 +1000"

          recreated="$(printf '%s\n' 'fix(history): remove redundant failure description' | git commit-tree "${TREE}" -p "${PARENT}")"
          test "${recreated}" = "${COMMIT}"

          existing="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          if [ -n "${existing}" ]; then
            test "${existing}" = "${COMMIT}"
            echo "Target branch already exists at audited SHA."
            exit 0
          fi

          git push origin "${COMMIT}:${TARGET}"
          remote="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          test "${remote}" = "${COMMIT}"
          echo "Published audited branch at ${remote}."
