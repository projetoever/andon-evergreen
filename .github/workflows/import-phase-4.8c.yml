name: Import audited phase 4.8C

on:
  push:
    branches:
      - chore/import-phase-4.8c

permissions:
  contents: write

jobs:
  import-audited-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate and publish exact audited fixture correction
        shell: bash
        run: |
          set -euo pipefail

          PARENT="38400d7165ab14926cd15423f04ebaf41dea9755"
          COMMIT="d72db59ab3e0eabf15c2c34f8c964e4d7dcca5e3"
          TREE="3721e1e525b7c2836ae966d8b2bcad824008f4dc"
          TARGET="refs/heads/feat/workstation-finish-restriction"

          cp .phase-import/phase48c.patch.b64 /tmp/phase48c.patch.b64

          git fetch origin feat/workstation-finish-restriction
          current="$(git rev-parse FETCH_HEAD)"
          test "${current}" = "${PARENT}"

          git checkout --detach "${PARENT}"
          base64 -d /tmp/phase48c.patch.b64 | gzip -d > /tmp/phase48c.patch
          git apply --index /tmp/phase48c.patch

          tree="$(git write-tree)"
          test "${tree}" = "${TREE}"

          export GIT_AUTHOR_NAME="Codex"
          export GIT_AUTHOR_EMAIL="codex@openai.com"
          export GIT_AUTHOR_DATE="@1790762047 +1000"
          export GIT_COMMITTER_NAME="Codex"
          export GIT_COMMITTER_EMAIL="codex@openai.com"
          export GIT_COMMITTER_DATE="@1790762047 +1000"

          recreated="$(printf '%s\n' 'test(workstations): complete system test maintenance fixture' | git commit-tree "${TREE}" -p "${PARENT}")"
          test "${recreated}" = "${COMMIT}"

          git push origin "${COMMIT}:${TARGET}"

          remote="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          test "${remote}" = "${COMMIT}"
          echo "Updated PR branch at audited SHA ${remote}."
