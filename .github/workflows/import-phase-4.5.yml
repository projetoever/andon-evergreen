name: Import audited phase 4.5

on:
  push:
    branches:
      - chore/import-phase-4.5

permissions:
  contents: write

jobs:
  import-audited-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate and publish exact audited commit
        shell: bash
        run: |
          set -euo pipefail

          BASE="58789a0de2d3ba5e86eaadae561ba5597ec675af"
          COMMIT="48732b3b16088273a4031adb6bc2cff263adb2db"
          TREE="f58589f3b0993686b74de0154702e89948250aea"
          TARGET="refs/heads/feat/edit-call-failure-details"

          cp .phase-import/phase45.patch.b64 /tmp/phase45.patch.b64

          git cat-file -e "${BASE}^{commit}"
          git checkout --detach "${BASE}"

          base64 -d /tmp/phase45.patch.b64 | gzip -d > /tmp/phase45.patch
          git apply --index /tmp/phase45.patch

          tree="$(git write-tree)"
          test "${tree}" = "${TREE}"

          export GIT_AUTHOR_NAME="Codex"
          export GIT_AUTHOR_EMAIL="codex@openai.com"
          export GIT_AUTHOR_DATE="@1790696582 -0300"
          export GIT_COMMITTER_NAME="Codex"
          export GIT_COMMITTER_EMAIL="codex@openai.com"
          export GIT_COMMITTER_DATE="@1790696582 -0300"

          recreated="$(printf '%s\n' 'feat(history): edit structured call failure details' | git commit-tree "${TREE}" -p "${BASE}")"
          test "${recreated}" = "${COMMIT}"

          existing="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          if [ -n "${existing}" ]; then
            test "${existing}" = "${COMMIT}"
            echo "Target branch already exists at audited SHA."
            exit 0
          fi

          git push origin "${COMMIT}:${TARGET}"

          remote="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          test "${remote}" = "${COMMIT}"

          echo "Published audited branch at ${remote}."
