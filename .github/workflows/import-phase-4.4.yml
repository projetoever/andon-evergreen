name: Import audited phase 4.4

on:
  push:
    branches:
      - chore/import-phase-4.4

permissions:
  contents: write

jobs:
  import-audited-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate and publish exact audited commits
        shell: bash
        run: |
          set -euo pipefail

          BASE="d6be99c9a4ccb9854976fd5cc3e6cc73079cd781"
          C1="cce98736528d6cc59147d38b7f44cee628333af3"
          C2="46c116e795b76bda2b95b89ebf62b8355a50159d"
          TREE1="18c825d1f0731d94c21a5caf61347fc0d2f56afe"
          TREE2="731d1215a951a5e983347ed4c958a6456e3288a4"
          TARGET="refs/heads/fix/require-failure-details-on-finish"

          cp .phase-import/p1.b64 /tmp/p1.b64
          cp .phase-import/p2.b64 /tmp/p2.b64

          git cat-file -e "${BASE}^{commit}"
          git checkout --detach "${BASE}"

          base64 -d /tmp/p1.b64 | gzip -d > /tmp/p1.patch
          git apply --index /tmp/p1.patch

          tree1="$(git write-tree)"
          test "${tree1}" = "${TREE1}"

          export GIT_AUTHOR_NAME="Codex"
          export GIT_AUTHOR_EMAIL="codex@openai.com"
          export GIT_AUTHOR_DATE="@1790678468 +1000"
          export GIT_COMMITTER_NAME="Codex"
          export GIT_COMMITTER_EMAIL="codex@openai.com"
          export GIT_COMMITTER_DATE="@1790678468 +1000"

          c1="$(printf '%s\n' 'fix(calls): require failure details on finish' | git commit-tree "${TREE1}" -p "${BASE}")"
          test "${c1}" = "${C1}"

          git reset --hard "${C1}"

          base64 -d /tmp/p2.b64 | gzip -d > /tmp/p2.patch
          git apply --index /tmp/p2.patch

          tree2="$(git write-tree)"
          test "${tree2}" = "${TREE2}"

          export GIT_AUTHOR_DATE="@1790680064 +1000"
          export GIT_COMMITTER_DATE="@1790680064 +1000"

          c2="$(printf '%s\n' 'fix(andon): persist failure details without synthetic stop events' | git commit-tree "${TREE2}" -p "${C1}")"
          test "${c2}" = "${C2}"

          existing="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          if [ -n "${existing}" ]; then
            test "${existing}" = "${C2}"
            echo "Target branch already exists at the audited SHA."
            exit 0
          fi

          git push origin "${C2}:${TARGET}"

          remote="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          test "${remote}" = "${C2}"

          echo "Published audited branch at ${remote}."
