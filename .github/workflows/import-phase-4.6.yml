name: Import audited phase 4.6

on:
  push:
    branches:
      - chore/import-phase-4.6

permissions:
  contents: write

jobs:
  import-audited-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate and publish exact audited commit
        shell: bash
        run: |
          set -euo pipefail

          BASE="a1e583d015433e15759bca6a0dba23176d52770c"
          COMMIT="0985320c5d7dc71d94ed02a415c2b1c40f2c5770"
          TREE="2adc9b35c18495ef59f64fa6ddff63bef0d8cac0"
          TARGET="refs/heads/feat/per-machine-work-order-requirement"

          cp .phase-import/phase46.patch.b64 /tmp/phase46.patch.b64

          git cat-file -e "${BASE}^{commit}"
          git checkout --detach "${BASE}"

          base64 -d /tmp/phase46.patch.b64 | gzip -d > /tmp/phase46.patch
          git apply --index /tmp/phase46.patch

          tree="$(git write-tree)"
          test "${tree}" = "${TREE}"

          export GIT_AUTHOR_NAME="Codex"
          export GIT_AUTHOR_EMAIL="codex@openai.com"
          export GIT_AUTHOR_DATE="@1790699667 -0300"
          export GIT_COMMITTER_NAME="Codex"
          export GIT_COMMITTER_EMAIL="codex@openai.com"
          export GIT_COMMITTER_DATE="@1790699667 -0300"

          recreated="$(printf '%s\n' 'feat(andon): configure work order requirement per machine' | git commit-tree "${TREE}" -p "${BASE}")"
          test "${recreated}" = "${COMMIT}"

          existing="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          if [ -n "${existing}" ]; then
            test "${existing}" = "${COMMIT}"
            echo "Target branch already exists at the audited SHA."
            exit 0
          fi

          git push origin "${COMMIT}:${TARGET}"

          remote="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          test "${remote}" = "${COMMIT}"

          echo "Published audited branch at ${remote}."
