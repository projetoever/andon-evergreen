name: Import audited phase 4.8B

on:
  push:
    branches:
      - chore/import-phase-4.8b

permissions:
  contents: write

jobs:
  import-audited-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate and publish exact audited fixture correction
        shell: bash
        run: |
          set -euo pipefail

          PARENT="9c41b440285d065834f495646c2721a7c425c9bf"
          COMMIT="38400d7165ab14926cd15423f04ebaf41dea9755"
          TREE="7e63c5b6533c562be53888f7e58459a3d8219587"
          TARGET="refs/heads/feat/workstation-finish-restriction"

          cp .phase-import/phase48b.patch.b64 /tmp/phase48b.patch.b64

          git fetch origin feat/workstation-finish-restriction
          current="$(git rev-parse FETCH_HEAD)"
          test "${current}" = "${PARENT}"

          git checkout --detach "${PARENT}"
          base64 -d /tmp/phase48b.patch.b64 | gzip -d > /tmp/phase48b.patch
          git apply --index /tmp/phase48b.patch

          tree="$(git write-tree)"
          test "${tree}" = "${TREE}"

          export GIT_AUTHOR_NAME="Codex"
          export GIT_AUTHOR_EMAIL="codex@openai.com"
          export GIT_AUTHOR_DATE="@1790758357 +1000"
          export GIT_COMMITTER_NAME="Codex"
          export GIT_COMMITTER_EMAIL="codex@openai.com"
          export GIT_COMMITTER_DATE="@1790758357 +1000"

          recreated="$(printf '%s\n' 'test(workstations): isolate active failure classification fixture' | git commit-tree "${TREE}" -p "${PARENT}")"
          test "${recreated}" = "${COMMIT}"

          git push origin "${COMMIT}:${TARGET}"

          remote="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          test "${remote}" = "${COMMIT}"
          echo "Updated PR branch at audited SHA ${remote}."
