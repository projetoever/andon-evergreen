name: Import audited phase 4.8.1

on:
  push:
    branches:
      - chore/import-phase-4.8.1

permissions:
  contents: write

jobs:
  import-audited-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate and publish exact audited phase 4.8.1 commit
        shell: bash
        run: |
          set -euo pipefail

          PARENT="cc222bf4110503031ead7045a1da6cebbcca75cf"
          COMMIT="0794325e99bad08302aa15c1ed5682ba2107e435"
          TREE="33a6083ca2b7496f1126fdc4abb8861ee02366ed"
          TARGET="refs/heads/feat/workstation-finish-restriction-ux"

          cp .phase-import/phase481.patch.b64 /tmp/phase481.patch.b64

          git cat-file -e "${PARENT}^{commit}"
          git checkout --detach "${PARENT}"

          base64 -d /tmp/phase481.patch.b64 | gzip -d > /tmp/phase481.patch
          git apply --index /tmp/phase481.patch

          tree="$(git write-tree)"
          test "${tree}" = "${TREE}"

          export GIT_AUTHOR_NAME="Codex"
          export GIT_AUTHOR_EMAIL="codex@openai.com"
          export GIT_AUTHOR_DATE="@1790766963 +1000"
          export GIT_COMMITTER_NAME="Codex"
          export GIT_COMMITTER_EMAIL="codex@openai.com"
          export GIT_COMMITTER_DATE="@1790766963 +1000"

          recreated="$(printf '%s\n' 'feat(workstations): surface maintenance completion authorization' | git commit-tree "${TREE}" -p "${PARENT}")"
          test "${recreated}" = "${COMMIT}"

          existing="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          if [ -n "${existing}" ]; then
            test "${existing}" = "${COMMIT}"
            echo "Target branch already exists at audited SHA."
            exit 0
          fi

          git push origin "${COMMIT}:${TARGET}"

          remote="$(git ls-remote origin "${TARGET}" | awk '{print $1}')"
          test "${remote}" = "${COMMIT}"
          echo "Published audited branch at ${remote}."
